# The power board's supervisor presses the dev kit's power key (J14 pins 12/11, SLEEP/WAKE*) when
# the car's button is pressed or the pack is low. Linux sees it as KEY_POWER (verify on the car
# with `sudo evtest`). Shut down on it, even with a desktop session holding an inhibitor. At the
# end of the shutdown /usr/lib/systemd/system-shutdown/atlas-halt tells the supervisor, which
# then switches the car off.
[Login]
HandlePowerKey=poweroff
PowerKeyIgnoreInhibited=yes
