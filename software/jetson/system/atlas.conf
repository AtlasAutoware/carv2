# /etc/atlas/atlas.conf: read by the Atlas services (EnvironmentFile=), the shutdown hook and the
# atlas command's defaults. Rev B (dev-kit carrier + ATLAS-PWR-1 power board).

# The power board supervisor's USB port (a Raspberry Pi Pico, udev name from 99-atlas.rules).
ATLAS_SUPERVISOR_TTY=/dev/atlas_supervisor

# Lidar power at boot (1 = on). atlas-hw-init applies it once per boot through the supervisor.
# ROS launch files can still switch it with `atlas lidar on|off` or the /lidar_power service.
ATLAS_LIDAR_AT_BOOT=1

# Clean shutdown when the pack gets low: the I x R corrected cell voltage below this for 30 s
# (not while charging). The BMS cuts the pack at its own cell undervoltage setting (3.00 V per
# cell planned); the supervisor also shuts down below 11.6 V on its own. Empty = off.
ATLAS_SHUTDOWN_CELL_V=3.30

# Pack resistance used for that correction, in ohms. A guess until measured (docs/SOFTWARE.md).
ATLAS_PACK_R=0.05

# J12 GPIO lines, only if `gpioinfo` on the car disagrees with atlas_hw/board.py. Give a line
# name or chip:offset, e.g. ATLAS_GPIO_JETSON_UP=PQ.06 or ATLAS_GPIO_JETSON_UP=gpiochip0:106.
#ATLAS_GPIO_JETSON_UP=
#ATLAS_GPIO_LIDAR_REQ=
#ATLAS_GPIO_ESTOP_OK=
#ATLAS_GPIO_CHG_STAT_N=
