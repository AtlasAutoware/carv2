# /etc/atlas/atlas.conf: read by the Atlas services (EnvironmentFile=) and the atlas command's defaults.

# Lidar power at boot (1 = on). ROS launch files can still switch it with `atlas lidar on|off`
# or the /atlas/lidar_power service.
ATLAS_LIDAR_AT_BOOT=1

# Low Region binary for the USB-C PD controller. If its EEPROM is blank or bad, atlas-hw-init
# loads this into the controller's RAM at every boot so charging works while the car is on.
ATLAS_PD_LOWREGION=/etc/atlas/tps25751_lowregion.bin

# Clean shutdown when the pack gets low: the I x R corrected cell voltage below this for 30 s
# (not while charging). The BMS cuts the pack at 3.00 V per cell. Empty = off.
ATLAS_SHUTDOWN_CELL_V=3.30

# Pack resistance used for that correction, in ohms. A guess until measured (docs/SOFTWARE.md).
ATLAS_PACK_R=0.05

# 1: the drive board has the POWER_EN fix (R609 to +3V3, R625; every board built from the Sept 29
# files, docs/FLASHING.md), so `atlas stm32` may reset the STM32. Set 0 on an older board.
ATLAS_POWER_EN_FIXED=1
